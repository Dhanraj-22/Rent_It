# Local development defaults. Set SPRING_PROFILES_ACTIVE=prod to use your hosted database settings.
spring.datasource.url=jdbc:h2:file:./data/rent-it;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Email delivery is optional locally so listing and request workflows always work.
app.mail.enabled=false
app.mail.from=no-reply@rent-it.local
app.registration.auto-verify=true
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
