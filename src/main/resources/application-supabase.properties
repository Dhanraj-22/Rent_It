# Activate with SPRING_PROFILES_ACTIVE=supabase.
# SUPABASE_DB_URL must be the complete Session Pooler JDBC URL copied from the Supabase Connect dialog.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8086}
app.base-url=${APP_BASE_URL:http://localhost:8086}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.registration.auto-verify=false
app.mail.enabled=${APP_MAIL_ENABLED:true}
